# Publishes to npm when the private release process pushes the `release` branch.
# Authenticates with npm trusted publishing (OIDC): no NPM_TOKEN secret is used.
# Trusted publishing needs npm >= 11.5.1, which the "Update npm" step ensures
# (Node 22 ships with npm 10).
name: Publish to npm

on:
  push:
    branches: [release]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    # The release branch is pushed to both the private origin and the public
    # mirror, so without this guard the private repository also tries to
    # publish and fails on every release — it has no trusted-publisher claim,
    # and the version has already been taken by the mirror's successful run.
    if: github.repository == 'Syntax-Syllogism/sfd'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Publish to npm
        # OIDC trusted publishing; provenance is attached automatically.
        run: npm publish --access public
